<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Habits</title><link rel="stylesheet" href="style.css"></head><body><main><header><span>SMALL STEPS, EVERY DAY</span><h1>A little better.</h1><p>A gentle place for the routines that matter.</p></header><section class="progress"><div><strong id="score">0</strong><p>habits completed today</p></div><div><p id="date"></p><button id="reset" class="quiet">Clear today’s checks</button></div></section><h2>Your daily rituals</h2><div id="habits"></div><form id="add"><label for="name">One more good habit</label><div class="inline"><input id="name" maxlength="50" placeholder="Read for 15 minutes" required><button>Add habit</button></div></form><p id="status" role="status"></p><footer>Your routines stay on this browser. Each dot shows a day in the last week.</footer></main><script src="app.js"></script></body></html>
