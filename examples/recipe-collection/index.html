<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Recipe Shelf</title><link rel="stylesheet" href="style.css"></head><body><main><header><span>THE RECIPE SHELF</span><h1>Good food.<br>Less deciding.</h1><p>A few simple favorites for your everyday table.</p></header><div class="tools"><input type="search" id="search" aria-label="Search recipes" placeholder="Find a recipe or ingredient"><select id="meal" aria-label="Meal type"><option>All meals</option><option>Breakfast</option><option>Lunch</option><option>Dinner</option></select><button id="favorites" aria-pressed="false">Favorites</button></div><p id="count" role="status"></p><div id="recipes"></div><section class="shopping"><div><h2>Your shopping list</h2><p>Add ingredients from a recipe, then check them off.</p></div><button id="clear">Clear list</button><div id="list"></div></section><p id="status" role="status"></p><footer>Recipes are starter ideas. Favorites and shopping items stay on this browser.</footer></main><script src="app.js"></script></body></html>
